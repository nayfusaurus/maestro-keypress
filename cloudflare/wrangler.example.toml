# SPDX-License-Identifier: MPL-2.0
name = "maestro-metrics"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "maestro-metrics"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["5 0 * * *"]
