# SPDX-License-Identifier: MPL-2.0
[project]
name = "maestro"
version = "2.1.0"
description = "Add your description here"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "nayfusaurus", email = "35911760+nayfusaurus@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "idna>=3.20",
    "mido==1.3.3",
    "pydirectinput==1.0.4",
    "pynput==1.8.2",
    "pywin32; sys_platform == 'win32'",
    "PySide6>=6.12.0,<7.0.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[project.scripts]
maestro = "maestro:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "msgpack>=1.2.4",
    "mypy==2.4.1",
    "pillow>=13.0.0",
    "pip-audit>=2.10.1",
    "pygments>=2.21.0",
    "pyinstaller==6.22.3",
    "pytest==9.2.0",
    "pytest-qt>=4.5.0",
    "ruff==0.17.6",
    "ty>=0.0.112",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"src/maestro/gui/*" = ["N802"]  # Allow Qt method overrides (paintEvent, closeEvent, etc.)

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enforce, don't block on existing code
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

# Third-party library handling
ignore_missing_imports = true  # Libraries like mido, pynput may lack stubs

# Specific module configurations if needed
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # Allow looser typing in tests
