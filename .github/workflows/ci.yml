# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  reporting:
    name: Metrics Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: node --test cloudflare/worker.test.mjs

  security:
    name: Security Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Bandit security scan
        run: uv run bandit -r src/maestro -ll -ii

      - name: Upgrade build tools
        run: uv pip install --upgrade pip setuptools

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2026-2875 \
            --ignore-vuln PYSEC-2026-2876 \
            --ignore-vuln PYSEC-2026-3447

  lint:
    name: Lint (Ruff + mypy + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check src/

      - name: Run Ruff format check
        run: uv run ruff format --check src/

      - name: Run mypy
        run: uv run mypy src/maestro/

      - name: Run ty
        run: uv run ty check src/

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [security, lint]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run uv run pytest -v

      - name: Test Windows dependencies and application
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --locked python -c "import win32gui, pydirectinput"
          uv run --locked pytest -q

  build:
    name: Build Windows Exe
    runs-on: windows-latest
    needs: [security, lint, test, reporting]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build exe
        env:
          MAESTRO_METRICS_URL: ${{ vars.MAESTRO_METRICS_URL }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and !$env:MAESTRO_METRICS_URL) {
            throw "Set the repository variable MAESTRO_METRICS_URL before publishing this release."
          }
          uv run pyinstaller Maestro.spec --noconfirm

      - name: Prepare release files
        run: |
          Copy-Item dist/Maestro.exe Maestro.exe
          $hash = Get-FileHash Maestro.exe -Algorithm SHA256
          $hash.Hash | Out-File Maestro.exe.sha256
          Write-Output "SHA256: $($hash.Hash)"

      - name: Upload exe and checksum artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Maestro-Windows
          path: |
            Maestro.exe
            Maestro.exe.sha256

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: Maestro-Windows

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            Maestro.exe
            Maestro.exe.sha256
          generate_release_notes: true
